<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!-- The app is light-only by design (see src/telegram.ts). Declaring it here too
         stops the browser painting a dark scroll gutter or form controls around a light
         page when the device is in dark mode. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quiz Patente</title>
    <!-- Telegram's bridge. It must come from telegram.org and be loaded before the app:
         window.Telegram.WebApp.initData is the only way to know who is asking. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
