<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!-- Both themes are supported now. Declaring both here lets the browser paint the
         scroll gutter and form controls correctly BEFORE the script runs; applyTheme then
         pins the actual choice on documentElement. Declaring only "light" here made a
         dark-mode device flash a white gutter around a dark page on every open. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1420" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quiz Patente</title>
    <!-- The app shipped with no icon of any kind, so a browser tab, a bookmark and an
         add-to-home-screen all fell back to a blank-page glyph. The mark is a steering
         wheel with a gold check. It is quantised to 48 colours because it only uses
         three — the anti-aliasing was otherwise seven eighths of the file (210 KB -> 29 KB
         at 512px). Declared "maskable" in the manifest so Android crops its round icon out
         of the full-bleed square instead of shrinking the whole square into a circle. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Telegram's bridge. It must come from telegram.org and be loaded before the app:
         window.Telegram.WebApp.initData is the only way to know who is asking. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
