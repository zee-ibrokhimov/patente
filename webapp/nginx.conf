# The Mini App's public edge, and the whole of its access control at the HTTP layer.
#
# ⚠️  Only two things may be reachable from here. Adding a third is a security change,
# not a convenience:
#
#   /           the built frontend (static files)
#   /webapp/*   the initData-authenticated API
#
# Everything else on the API stays unroutable BY OMISSION — there is no location block
# for it, so nginx answers 404 without ever contacting the API. That covers
# /users/{chat_id}/* (identity from the URL — hands out paid passes and deletes users),
# /health, /docs, /openapi.json and the /figures file_id cache.
#
# Do not add `proxy_pass` under a bare `location /`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Telegram's webview caches hard. Hashed asset names make redeploys land; the
    # entry document itself must never be cached or the hashes never change.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hosted fonts. Filenames are content-hashed, so they can be cached hard —
    # and self-hosting means no request to a third party from inside Telegram's
    # webview, which is both faster and better for the user's privacy.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { font/woff2 woff2; text/css css; }
    }

    # Explicit refusals for the private API surface.
    #
    # These would already fail: with no proxy_pass they fall through to the SPA
    # fallback below and get index.html. But that is protection by accident — it
    # depends on `try_files` staying exactly as it is, and it answers 200 with HTML,
    # which reads like a working endpoint to anyone probing or debugging. Saying 404
    # out loud makes the boundary a decision instead of a side effect, and means a
    # later edit to the fallback cannot quietly expose these.
    location = /users      { return 404; }
    location ^~ /users/    { return 404; }
    location = /health     { return 404; }
    location = /docs       { return 404; }
    location = /redoc      { return 404; }
    location = /openapi.json { return 404; }
    # /figures/ is STATIC and deliberately unauthenticated — see webapp/Dockerfile.
    # These are public-domain ministerial sign images and contain nothing about any
    # user. This does NOT proxy to the API, so the API's own /figures/{name}/file-id
    # cache write stays unreachable from here.
    location ^~ /figures/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location ^~ /webhooks/ { return 404; }
    location ^~ /topics    { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /webapp/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # initData travels in this header and the HMAC covers its exact bytes.
        # underscores_in_headers is irrelevant here (the name uses hyphens), but the
        # header must not be rewritten or dropped by any intermediary.
        proxy_pass_request_headers on;

        # Explanation generation on a cold cache is a live model call: STATUS §16
        # measured the "Perché?" fallback at 4.9s. The default 60s is ample, but a
        # short one would turn a slow explanation into an error.
        proxy_read_timeout 120s;
    }

    # Telegram embeds the app in a webview; framing by anyone else is not wanted.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
