# Coolify deployment: two services from one image, one private network.
#
# ⚠️  SECURITY — read before adding anything to this file.
#
# The API has NO AUTHENTICATION of any kind. Anything that can reach it can grant
# itself an unlimited paid pass (POST /users/{chat_id}/pass), read any user, or
# delete any user and their progress.
#
# What actually keeps it safe, measured rather than assumed: it has NO DOMAIN, so
# Traefik generates no router for it and there is no path in from the edge. The
# `internal` network below is NOT what protects it — Coolify attaches every service
# to its own proxy network as well, so coolify-proxy can reach the api container and
# a probe from that network gets a 200. Isolation is the absent router plus the
# single proxied prefix in webapp/nginx.conf, not network privacy.
#
# Therefore, for the `api` service:
#   - do NOT add a `ports:` mapping (that publishes it on the host)
#   - do NOT set a domain / FQDN on it in Coolify — this is the load-bearing one
#
# Exactly one path may ever be public: POST /webhooks/tribute. It is the only
# endpoint that authenticates its caller (HMAC-SHA256 over the raw body) and it
# fails closed when TRIBUTE_WEBHOOK_SECRET is unset. Exposing it means a router
# matched on Host + Path + Method — never a blanket route to this service.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - patente-data:/data
    environment:
      # Real environment variables take precedence over .env in pydantic-settings,
      # which is what we want here — Coolify is the source of truth (STATUS §14.6).
      - ENV=prod
      - DATABASE_URL=sqlite+aiosqlite:////data/patente.db
      - API_BASE_URL=http://127.0.0.1:8000
      - BOT_TOKEN_PROD=${BOT_TOKEN_PROD}
      - BOT_USERNAME=${BOT_USERNAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TRANSLATE_MODEL=${OPENAI_TRANSLATE_MODEL:-}
      # 0: superseded by the 7-day trial. A taster running alongside a trial means a
      # lapsed user silently gets three more explanations for free.
      - FREE_EXPLANATIONS=${FREE_EXPLANATIONS:-0}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - SUPPORT_CONTACT=${SUPPORT_CONTACT}
      - TRIBUTE_API_KEY=${TRIBUTE_API_KEY:-}
      - TRIBUTE_WEBHOOK_SECRET=${TRIBUTE_WEBHOOK_SECRET:-}
      - TRIBUTE_PRODUCT_1M=${TRIBUTE_PRODUCT_1M:-}
      - TRIBUTE_PRODUCT_3M=${TRIBUTE_PRODUCT_3M:-}
      - TRIBUTE_PRODUCT_6M=${TRIBUTE_PRODUCT_6M:-}
    # ONE worker, never more. SQLite plus the per-cluster in-process lock that
    # dedupes concurrent OpenAI calls both assume a single process; --workers
    # would mean duplicate paid API calls and write contention.
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # Seeding 7106 questions and clustering 3382 runs before uvicorn starts on a
      # cold volume, so start_period is generous on purpose — a short one marks the
      # first deploy unhealthy while it is doing exactly what it should.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The bot holds no database handle and runs no migrations — the API owns both.
      - PATENTE_SKIP_MIGRATE=1
      - ENV=prod
      - API_BASE_URL=http://api:8000
      # Where /start sends people. Drilling lives in the Mini App now, so without
      # this the bot answers but offers no way through to the questions.
      - WEBAPP_URL=${WEBAPP_URL:-}
      - BOT_TOKEN_PROD=${BOT_TOKEN_PROD}
      - BOT_USERNAME=${BOT_USERNAME}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - SUPPORT_CONTACT=${SUPPORT_CONTACT}
      # 0: superseded by the 7-day trial. A taster running alongside a trial means a
      # lapsed user silently gets three more explanations for free.
      - FREE_EXPLANATIONS=${FREE_EXPLANATIONS:-0}
    command: ["python", "-m", "bot.main"]

  # The Mini App. This is the ONLY service that should ever carry a domain.
  #
  # It serves the built frontend and reverse-proxies exactly one prefix, /webapp/*,
  # to the API. Everything else on the API has no location block and is therefore
  # unreachable through it — see webapp/nginx.conf, which is the access control.
  #
  # Never put a domain on `api`. Its /users/{chat_id}/* routes take identity from the
  # URL and would hand out unlimited paid passes to anyone who found them.
  web:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    labels:
      # Coolify attaches every service to its own proxy network as well as to the
      # networks declared here, so this container has two addresses. Traefik picks one
      # to forward to, and with no hint it chose the `internal` one — which the proxy
      # is not on. The result was not an error but a hang: every request to
      # patente.zeehub.xyz timed out while the container served fine from inside.
      #
      # This names the network Traefik must use. It is the app's Coolify network, whose
      # name is the application UUID.
      - "traefik.docker.network=rboj5u2xk5dj4o4yto89ablh"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  internal:
    # Not external, not shared with the Coolify proxy. Only these services.
    driver: bridge

volumes:
  patente-data:
    # Every user's progress and entitlement, plus the explanations and translations
    # that cost real money to generate. Losing this volume loses all of it.
    driver: local
