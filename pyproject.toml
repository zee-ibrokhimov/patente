[project]
name = "patente-bot"
version = "0.1.0"
description = "Telegram bot drilling the official Italian driving-theory question bank with native-language translations and explanations"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # Explanations are generated on request now (STATUS.md §13), so this is a runtime
    # dependency of the API rather than of the offline content pipeline.
    "openai>=1.57",
]

[project.optional-dependencies]
content = [
    "pymupdf>=1.24",
    "rapidfuzz>=3.10",
    # rapidfuzz.process.cdist — the pairwise-similarity matrix cluster.py builds —
    # imports numpy lazily, so it is a hard requirement without being declared as one.
    "numpy>=2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# `content/` is a directory of one-off scripts run as `python content/x.py`, and
# `questions/` holds the (gitignored) source PDF — neither is an importable
# package, so autodiscovery must be told what the distribution actually contains.
[tool.setuptools.packages.find]
include = ["api*", "bot*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
